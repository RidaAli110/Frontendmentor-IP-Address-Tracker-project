<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>

    <title>Frontend Mentor | IP Address Tracker</title>
  </head>
  <body>
    <header>
      <picture>
        <source
          media="(max-width: 600px)"
          srcset="/images/pattern-bg-mobile.png"
        />
        <img src="/images/pattern-bg-desktop.png" alt="" class="head-img" />
      </picture>
      <h1 class="title">IP Address Tracker</h1>
    </header>
    <main>
      <form id="address-input">
        <label class="visually-hidden" for="ip-input">IP address input</label>
        <input id="ip-input" type="text" placeholder="Enter IP address" />
        <button aria-label="Search" id="search-btn" type="button">
          <img src="/images/icon-arrow.svg" alt="" />
        </button>
      </form>
    </main>
  </body>
</html>
